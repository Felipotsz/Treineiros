name: Validar e testar
on: [push, pull_request]
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar as provas (JSON, gabaritos, assuntos)
        run: python3 tools/validar.py
  navegador:
    runs-on: ubuntu-latest
    needs: validar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar Playwright e Chromium
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Testar os fluxos num navegador de verdade
        run: |
          python3 -m http.server 8000 &
          sleep 2
          node tools/testar_navegador.js http://localhost:8000/
      - name: Auditoria (todas as páginas, celular e computador, tema claro e noturno, acessibilidade)
        run: |
          npm install --no-save axe-core@4.10.2
          node tools/auditar.js http://localhost:8000/
