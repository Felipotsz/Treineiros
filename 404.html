<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Página não encontrada | Treineiros</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1.5rem;font:1.125rem/1.7 Georgia,serif;background:#E0E1E3;color:#06191F;text-align:center}
  main{max-width:28rem;padding:2.25rem 1.75rem;background:#F7F8F8;border:1px solid #B5BABD;border-radius:18px;box-shadow:0 12px 30px -22px rgba(6,25,31,.42)}
  h1{margin:0 0 .5rem;font-size:2.25rem;line-height:1.15;font-family:"Playfair Display",Georgia,serif}
  .bolhas{display:flex;justify-content:center;gap:6px;margin:0 0 1rem}
  .bolhas i{width:14px;height:14px;border-radius:50%;border:2px solid #627A77}
  .bolhas i:nth-child(3){background:#9B3527;border-color:#9B3527}
  a{display:inline-block;margin-top:1rem;padding:.7rem 1.5rem;font-weight:700;color:#E0E1E3;background:#05333A;text-decoration:none;border-radius:999px}
  a:focus-visible{outline:3px solid #735826;outline-offset:3px}
  @media (prefers-color-scheme:dark){body{background:#06191F;color:#E0E1E3}main{background:#0F2F36;border-color:#1C3D44}a{background:#09565D}.bolhas i{border-color:#67807D}.bolhas i:nth-child(3){background:#EBA394;border-color:#EBA394}a:focus-visible{outline-color:#C9A86A}}
</style>
<meta name="theme-color" content="#06191F">
<link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
</head>
<body>
<main>
  <p class="bolhas" aria-hidden="true"><i></i><i></i><i></i><i></i></p>
  <h1>Página não encontrada</h1>
  <p>Esta página não existe, ou o endereço mudou.</p>
  <a id="inicio" href="/">Voltar ao início</a>
</main>
<script>
  // Em GitHub Pages de projeto (usuario.github.io/repositorio/), o início fica dentro da pasta do repositório.
  if (/\.github\.io$/.test(location.hostname)) document.getElementById("inicio").href = "/" + location.pathname.split("/")[1] + "/";
</script>
</body>
</html>
