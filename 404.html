<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Página não encontrada | Treineiros</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1.5rem;font:1.125rem/1.7 Georgia,serif;background:#EDE0C6;color:#2D2723;text-align:center}
  main{max-width:28rem;padding:2.25rem 1.75rem;background:#F4EAD5;border:1px solid #81614B;border-radius:2px;box-shadow:inset 0 0 0 5px #F4EAD5,inset 0 0 0 6px #CDB993}
  h1{margin:0 0 .5rem;font-size:2.25rem;line-height:1.15;font-family:"Playfair Display",Georgia,serif}
  .orn{color:#9C7228;font-size:1.5rem}
  a{display:inline-block;margin-top:1rem;padding:.65rem 1.4rem;font-variant-caps:all-small-caps;letter-spacing:.08em;font-weight:600;color:#F7EEDC;background:#7A2E22;border:1px solid #9C7228;text-decoration:none;border-radius:2px}
  a:focus-visible{outline:3px solid #9C7228;outline-offset:3px}
  @media (prefers-color-scheme:dark){body{background:#1E1813;color:#EADCC0}main{background:#2B241F;border-color:#9C8068;box-shadow:inset 0 0 0 5px #2B241F,inset 0 0 0 6px #4B3F35}a{background:#8C3B2E;border-color:#D4AC5E}.orn{color:#D4AC5E}a:focus-visible{outline-color:#D4AC5E}}
</style>
<meta name="theme-color" content="#1E1813">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
<main>
  <p class="orn" aria-hidden="true">❦</p>
  <h1>Página não encontrada</h1>
  <p>Esta página não existe, ou o endereço mudou.</p>
  <a id="inicio" href="/">Voltar ao início</a>
</main>
<script>
  // Em GitHub Pages de projeto (usuario.github.io/repositorio/), o início fica dentro da pasta do repositório.
  if (/\.github\.io$/.test(location.hostname)) document.getElementById("inicio").href = "/" + location.pathname.split("/")[1] + "/";
</script>
</body>
</html>
